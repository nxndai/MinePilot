name: Bug report
description: Report a reproducible problem in MinePilot
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove access tokens, passwords,
        personal paths and other sensitive data from logs before submitting.

        For security vulnerabilities, do **not** use this form. Follow
        [SECURITY.md](https://github.com/nxndai/MinePilot/blob/main/SECURITY.md)
        instead.

  - type: input
    id: version
    attributes:
      label: MinePilot version
      description: Shown in the launcher footer or the GitHub release.
      placeholder: "1.8.0"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Installation type
      options:
        - Windows installer
        - Portable application
        - Edge fallback installer
        - Running from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Windows 8.1
        - Windows 7
        - Other / not Windows
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact buttons or settings used.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, account names and personal paths before posting.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed access tokens and other secrets from this report.
          required: true