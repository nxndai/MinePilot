name: 功能请求 / Feature request
description: 提出改进建议或新功能 / Suggest an improvement or new feature
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [常见问题（FAQ）](https://github.com/nxndai/MinePilot#faq) 和已有 Issue。

        描述问题时不要包含账号令牌、密码或其他机密信息。English users can write the request in English.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你正在做什么？现在哪里不方便？请先描述使用场景，而不是只写一个功能名。
      placeholder: |
        例如：我想同时管理多个整合包，但每次都要手动切换游戏目录……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望启动器具体怎么表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。现有的临时办法、其他启动器的做法，或你不想采用的方式。

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 版本与 Java
        - 下载
        - 模组与整合包
        - 账户与登录
        - 诊断与日志
        - 界面 / 语言 / 皮肤
        - 安装 / 更新 / 打包
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意提交 PR
      description: 可选；不会影响建议的受理。
      options:
        - 可以先讨论，暂时不提交
        - 愿意尝试提交 PR
        - 已经做了一个原型

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交检查
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议。
          required: true
        - label: 这不是安全漏洞；安全问题会按 SECURITY.md 私下报告。
          required: true
